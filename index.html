<title>7.2 Texting on the Run</title>
<style>
:root{--y:#B88A00;--yl:#fff;--k:#000;--g:#000}
*{box-sizing:border-box}
html{font-size:min(2.3vh,1.3vw)}
body{margin:0;font-family:"Trebuchet MS",Verdana,sans-serif;background:#fff;color:var(--k);overflow:hidden}
#deck{position:fixed;inset:0 0 4.4rem 0}
.slide{display:none;position:absolute;inset:0;padding:2.2rem 4rem 1rem;overflow:hidden}
.slide.on{display:flex;flex-direction:column}
.slide:before{content:"";position:absolute;left:0;top:0;border-style:solid;border-width:5rem 5rem 0 0;border-color:var(--y) transparent transparent transparent}
.num{position:absolute;left:.7rem;top:.4rem;color:#fff;font-weight:700;font-size:1.3rem}
h1{font-size:4.4rem;margin:.2rem 0 .6rem;line-height:1.1}
h2{font-size:2.3rem;margin:0 0 1rem 0;padding-left:.2rem}
.tag{display:inline-block;background:var(--k);color:#fff;padding:.15rem .8rem;border-radius:2rem;font-size:1rem;margin-left:2.5rem;align-self:flex-start}
.ins{font-size:1.7rem;margin:.6rem 0 .8rem;border-left:.4rem solid var(--y);padding-left:.8rem}
.body{flex:1;display:flex;gap:2.5rem;align-items:flex-start;font-size:1.5rem}
.col{flex:1}
.big{font-size:6rem;line-height:1}
.chat{width:34rem;background:#fff;border:.3rem solid var(--y);border-radius:2rem;padding:.7rem 1rem}
.b{max-width:85%;padding:.35rem .8rem;border-radius:1rem;margin:.25rem 0;font-size:1.1rem;line-height:1.25}
.b.f{background:var(--y);color:#000;margin-right:auto}.b.i{background:#fff;color:#000;border:.15rem solid var(--y);margin-left:auto}
.it{margin:.5rem 0;line-height:2.7rem;font-size:1.55rem}
.it b{color:#000;text-decoration:underline var(--y) .25rem}
select,input{font:inherit;font-size:1.45rem;padding:.1rem .3rem;border:.15rem solid var(--y);border-radius:.4rem;background:#fff}
input{width:11rem}input.w{width:32rem}input.m{width:21rem}
.ok{border-color:var(--y)!important;background:var(--y)!important;color:#fff}.bad{border:.2rem dashed var(--y)!important;background:#fff!important;text-decoration:line-through}
.box{background:#fff;border:.2rem solid var(--y);border-radius:.8rem;padding:.6rem 1rem;margin:.4rem 0;font-size:1.6rem}

button.l{background:#fff;color:var(--k)}button.y{background:var(--y);border-color:var(--y);color:#fff}

.sm .it{font-size:1.25rem;line-height:2.3rem;margin:.3rem 0}

["🚌","You go on a bus, train or subway as a passenger.","take the bus / train / subway","/teɪk/","take + the + transport. I take the subway to work.","What does Inna take? (the bus)"],

S.push({t:"Let's talk",ins:"Talk with your team. Ask, answer and keep the conversation going!",h:`<div class="body" style="display:grid;grid-template-columns:1fr 1fr;gap:.8rem 2.5rem;width:100%;align-items:start">${[["🏫","Hey! How do you get to English class?","I take the bus to class, and I walk home."],["🛒","Do you walk or drive to the supermarket?","I drive. It's far from my house."],["💼","How do you get to work or college?","I take the subway. It's fast!"],["🏠","How do you get to your best friend's house?","I ride my bike. It's fun."]].map(a=>`<div><div class="b f" style="max-width:100%;font-size:1.8rem;padding:.5rem 1rem">${a[0]} ${a[1]}</div><div class="b i sg hid" style="max-width:92%;font-size:1.7rem;padding:.5rem 1rem">${a[2]}</div></div>`).join("")}</div><div style="font-size:1.8rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:.6rem 0"><b>Keep talking:</b>${["Why?","Who with?","How long?","Do you like it?"].map(x=>`<span style="background:var(--y);color:#fff;border-radius:2rem;padding:.2rem 1.1rem">${x}</span>`).join("")}</div><div class="btns"><button class="y" onclick="this.closest('.slide').querySelectorAll('.sg').forEach(e=>e.classList.toggle('hid'))">Show / hide suggested answers</button></div>`});
S.push({t:"Lead-in: the phone",h:`<div class="body" style="align-items:center;gap:3rem">${PHN(30,1.15)}<div class="col"><div class="ins" style="font-size:2.3rem;margin-bottom:1.5rem">Look at the phone. Who is Inna? Where is she going? Why?</div><div id="g" class="box hid" style="font-size:2.1rem">Inna is going to her parents' house. It's her mom's birthday, and the plant is a present.</div><div class="btns"><button class="y" onclick="document.getElementById('g').classList.toggle('hid')">Show / hide the answer</button></div></div></div>`});
S.push({t:"2B Read for detail",cls:"sm",after:PHN(23,.95),ins:"Read the text messages again. Correct the sentences.",ex:[E("1 <s>Inna is taking the bus to the mall.</s><br>Inna is taking the bus to __ .",["her parents' house","her parents house"],0,2),E("2 <s>Inna's dad is waiting at his house.</s><br>Inna's dad is waiting __ .",["at the bus stop"],0,2),E("3 <s>Inna is carrying a big bag.</s><br>Inna is carrying a big __ .",["plant"],0,2),E("4 <s>Today is Inna's dad's birthday.</s><br>Today is Inna's __ birthday.",["mom's","mom","mother's"],0,2)]});
S.push({t:"Notice the language",ins:"Read the text messages again. Which words are about transportation and places?",h:`<div class="body" id="nb">${chatHL()}<div class="col"><div class="box">Find and underline the words you notice.</div><div class="btns"><button class="y" onclick="document.getElementById('nb').classList.toggle('showhl')">Highlight the new language</button></div></div></div>`,n:"Noticing stage before MPF. Students find transportation and place phrases in pairs, then click Highlight to check. ICQ: Are you reading for the main idea or finding phrases? (finding phrases)"});
const IQ=["Do you say the phrase first or guess first? (guess first)","Do we write it now? (no, we say it)","Do we repeat together first or alone? (together)"];
const VP=["Students may say 'take bus' without the; stress BUS.","Use 'go to', not 'go at' / 'go in'.","'walk' /wɔːk/: silent l; do not say 'work'.","'at' for places (bus stop), 'on' for transport: contrast with the next phrase.","Spelling of carry → carrying (y stays).","Wait FOR someone; students may say 'wait someone'.","Ride a bike, not 'drive a bike'.","'on' the bus, not 'in' the bus.","Drive /draɪv/ vs ride; drive needs a car."];
V.forEach((v,i)=>S.push({t:`Vocabulary ${i+1}/9`,flip:v,n:N({a:`Teach "${v[2]}" with MPF.`,t:"2-3 min",s:["<b>Meaning:</b> show the icon and read the definition. Teams guess the phrase; click Reveal next to confirm.","<b>Pronunciation:</b> Reveal next; model 3 times at natural speed, then choral and individual drilling; mark stress on the board.","<b>Form:</b> Reveal next; show the pattern and the example from the chat; ask for one new example."],i:IQ[i%3],c:v[5],p:VP[i]})}));
S.push({t:"1B Choose the correct words",ins:"Choose the correct words from the menu to complete the sentences.",ex:[E("1 I <i>__</i> to class every day.",["ride my bike"],[["ride my bike","am at the bus stop"]]),E("2 I'm <i>__</i> for a friend right now.",["waiting"],[["waiting","walking"]]),E("3 We <i>__</i> to work on Fridays.",["take the subway"],[["are on the train","take the subway"]]),E("4 Are you <i>__</i> right now?",["carrying"],[["carrying","walking"]]),E("5 I'm <i>__</i> right now.",["at the train station"],[["at the train station","to the mall"]])]});
S.push({t:"Page 147 A",cls:"sm",ins:"Complete the sentences with the correct verbs.",box:"driving · going · riding · taking · waiting · walking",ex:[E("1 I'm not __ to work because my son has my car today.",["driving"]),E("2 Where are you? Mike is __ for you at the train station.",["waiting"]),E("3 Carolina is __ with her dog in the park right now.",["walking"]),E("4 We're __ to the mall because we need new shoes.",["going"]),E("5 Tonya is __ her bike to the store.",["riding"]),E("6 Mark isn't __ the bus to class because it's late.",["taking"])],sel:["driving","going","riding","taking","waiting","walking"]});

 d.innerHTML=h;deck.appendChild(d);
